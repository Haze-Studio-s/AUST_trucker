name: Deploy Script para VPS

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do repositório
      uses: actions/checkout@v4

    - name: Enviar ficheiros para a VPS
      uses: easingthemes/ssh-deploy@main
      with:
        SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
        REMOTE_HOST: ${{ secrets.VPS_HOST }}
        REMOTE_USER: ${{ secrets.VPS_USER }}
        TARGET: /home/ubuntu/fivem/server/txData/Qbox_BA141A.base/resources/[mods]/${{ github.event.repository.name }}
        EXCLUDE: "/.git/, /.github/"
        ARGS: "-rltgoDzvO --delete"
        SCRIPT_AFTER: |
          sed -i '/webpack_bundle/d' /home/ubuntu/fivem/server/txData/Qbox_BA141A.base/resources/[mods]/${{ github.event.repository.name }}/fxmanifest.lua 2>/dev/null || true
          find /home/ubuntu/fivem/server/txData/Qbox_BA141A.base/resources -name "fxmanifest.lua" -exec sed -i '/webpack_bundle/d' {} + 2>/dev/null || true
          rm -rf /home/ubuntu/fivem/server/txData/Qbox_BA141A.base/resources/[mods]/${{ github.event.repository.name }}/stream/flatbed3
          rm -rf /home/ubuntu/fivem/server/txData/Qbox_BA141A.base/cache/files/${{ github.event.repository.name }}
          rm -rf /home/ubuntu/fivem/server/txData/Qbox_BA141A.base/cache/files/trucks





