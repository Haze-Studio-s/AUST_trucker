name: Deploy Script para VPS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do repositório
      uses: actions/checkout@v4

    - name: Enviar ficheiros para a VPS
      uses: easingthemes/ssh-deploy@main
      with:
        SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
        REMOTE_HOST: ${{ secrets.VPS_HOST }}
        REMOTE_USER: ${{ secrets.VPS_USER }}
        TARGET: /home/ubuntu/fivem/server/txData/Qbox_BA141A.base/resources/[mods]/${{ github.event.repository.name }}
        EXCLUDE: "/.git/, /.github/"
